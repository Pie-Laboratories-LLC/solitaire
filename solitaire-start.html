<h1>Welcome to Solitaire</h1>
<h2>😝 DON'T PANIC! 😝</h2>
<p>
At any point, these buttons also exist below the main playing arrea!
</p>
<div><button type="BUTTON" onclick="this.dispatchEvent(new CustomEvent('solitaire',{ detail: { type: 'play' }, bubbles: true }))">PLAY</button></div>
<div><button type="BUTTON" onclick="this.dispatchEvent(new CustomEvent('solitaire',{ detail: { type: 'reset' }, bubbles: true }))">REDEAL</button></div>
<div><button type="BUTTON" onclick="this.dispatchEvent(new CustomEvent('solitaire',{ detail: { type: 'help' }, bubbles: true }))">HELP</button></div>
