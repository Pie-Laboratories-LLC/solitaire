<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.27.2/axios.min.js" integrity="sha512-odNmoc1XJy5x1TMVMdC7EMs3IVdItLPlCeL5vSUPN2llYKMJ2eByTTAIiiuqLg+GdNr9hF6z81p27DArRFKT7A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="./solitaire.css" type="text/css"></link>
<div id="solitaire">
<div class="canvas-container">
<canvas class="solitaire"></canvas>
</div><!-- .canvas-container -->
<div class="controls">
<button type="BUTTON" onclick="this.dispatchEvent(new CustomEvent('solitaire',{ detail: { type: 'fini' }, bubbles: true }))">FINI</button>
<button type="BUTTON" onclick="this.dispatchEvent(new CustomEvent('solitaire',{ detail: { type: 'forfeit' }, bubbles: true }))">FORFEIT</button>
<button type="BUTTON" onclick="this.dispatchEvent(new CustomEvent('solitaire',{ detail: { type: 'reset' }, bubbles: true }))">RESET</button>
<button type="BUTTON" onclick="this.dispatchEvent(new CustomEvent('solitaire',{ detail: { type: 'help' }, bubbles: true }))">HELP</button>
</div><!-- .controls -->
<div class="credits">
<dl>
<dt>Card Back</dt>
<dd>By John Opie - Tate Britain, Public Domain, <a href="https://commons.wikimedia.org/w/index.php?curid=2358904">Wikimedia Commons</a></dd>
<dt>Card Faces</dt>
<dd><a href="http://svg-cards.sourceforge.net/">svg-cards on sourceforge</a> by David Bellot</dd>
</dl>
</div> <!-- .credits -->
<div class="overlay game-dialog" style="display:none">
<div class="dialog">
<div class="x-bar"></div>
<div class="content">
</div>
</div>
</div>
<div class="overlay error-dialog" style="display:none">
<div class="dialog">
<div class="x-bar"></div>
<div class="content"></div>
</div><!-- .dialog -->
</div><!-- .error-dialog -->
</div><!-- #solitaire -->
<script type="module">
import SolitaireLoader from './solitaire-loader.js';
new SolitaireLoader();
</script>
